# /etc/nginx/sites-available/status.bevorasg.com
#
# TLS is added by:  certbot --nginx -d status.bevorasg.com
# Point the DNS A record for status.bevorasg.com at this host BEFORE running
# certbot -- HTTP-01 validation needs to reach port 80 here.
server {
    listen 80;
    listen [::]:80;
    server_name status.bevorasg.com;

    # Certbot rewrites this block to redirect to https and adds the 443 server.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # The app reads the LAST entry of this header, never the first: the
        # first is whatever the client sent. nginx appending the real peer here
        # is the only reason the value can be trusted at all.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The board polls twice every 15s per viewer; keep the access log for it
    # rather than silencing it -- this page is sensitive and who reads it
    # matters.
    access_log /var/log/nginx/status.bevorasg.com.access.log;
    error_log  /var/log/nginx/status.bevorasg.com.error.log;
}
