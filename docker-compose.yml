# bevoraSG netmap -- runs on the bevora-ops host, published to the world as
# https://status.bevorasg.com by the host's nginx (see deploy/nginx-status.conf).
#
# The container binds 127.0.0.1 ONLY. nginx is the sole way in, which is what
# lets the app trust the last X-Forwarded-For hop and unconditionally set
# Secure on its session cookie.
services:
  netmap:
    image: python:3.12-slim
    container_name: netmap
    restart: unless-stopped
    command: ["python3", "/app/server.py"]
    working_dir: /app
    environment:
      PYTHONUNBUFFERED: "1"
      NETMAP_PORT: "8080"
      NETMAP_DATA: "/data"
      NETMAP_REFRESH: "30"
      # Bootstrap credential. NOT literals -- these come from an untracked
      # `.env` file sitting next to this compose file on the box (see
      # deploy/README or the repo README "First run").
      #
      # They were literals once, and this repository is public: that published
      # `Mavrone` / `P@55w0rd` pair alongside a known URL is a race between the
      # owner's first login and anyone reading the repo. Whoever logs in first
      # sets the password, and the forced-change flow would then lock the owner
      # out rather than the attacker. A bootstrap credential is only safe while
      # it is unpublished.
      #
      # Unset => the server refuses to start rather than serving with a guess.
      NETMAP_USER: "${NETMAP_USER:?set NETMAP_USER in .env}"
      NETMAP_PASS: "${NETMAP_PASS:?set NETMAP_PASS in .env}"
      # Shared secret for remote push agents. Unset => ingest returns 503,
      # because an open ingest endpoint lets anyone paint the board green.
      NETMAP_PUSH_TOKEN: "${NETMAP_PUSH_TOKEN:-}"
    volumes:
      # Source read-only: the running container cannot rewrite its own code.
      - ./:/app:ro
      # Everything mutable -- database, live target list, acks, credentials.
      - netmap_data:/data
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  netmap_data:
